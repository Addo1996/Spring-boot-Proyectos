spring.application.name=proyectos


# Configuracion de la base de datos
spring.datasource.url=jdbc:postgresql://localhost:5432/proyectos_db
spring.datasource.username=postgres
spring.datasource.password=Addo08

# Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate: crear y actualizar tablas automaticamente
spring.jpa.hibernate.ddl-auto=update

# Mostrar SQL en consola
spring.jpa.show-sql=true

# Formatear SQL
spring.jpa.properties.hibernate.format_sql=true

# Logs de Spring
logging.level.org.springframework=INFO

# Logs de Hibernate SQL
logging.level.org.hibernate.SQL=DEBUG

# Mostrar parametros SQL
logging.level.org.hibernate.orm.jdbc.bind=TRACE
